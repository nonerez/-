
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Extract project ZIP
        run: |
          unzip -q nonevid-fixed-source.zip -d extracted
          test -f extracted/nonevid/settings.gradle.kts

      - name: Build APK
        working-directory: extracted/nonevid
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nonevid-debug-apk
          path: extracted/nonevid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

